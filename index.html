<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优惠券需求读取器</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1a1a2e;line-height:1.5;padding:20px}
.container{max-width:1400px;margin:0 auto}
h1{font-size:24px;font-weight:700;margin-bottom:4px}
.subtitle{color:#666;font-size:13px;margin-bottom:20px}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;color:#333}
.upload-area{border:2px dashed #c0c6d0;border-radius:10px;padding:40px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover,.upload-area.dragover{border-color:#4361ee;background:#f8f9ff}
.upload-area svg{width:40px;height:40px;color:#4361ee;margin-bottom:8px}
.upload-area p{color:#666;font-size:14px}
.upload-area .hint{font-size:12px;color:#999;margin-top:4px}
.btn{padding:8px 18px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-success{background:#10b981;color:#fff}.btn-success:hover{background:#0ea472}
.btn-outline{background:transparent;border:1px solid #d0d5dd;color:#555}.btn-outline:hover{background:#f5f5f5}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.table-wrap{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
th{background:#f1f3f5;font-weight:600;text-align:left;padding:8px 10px;position:sticky;top:0;border-bottom:2px solid #d0d5dd}
td{padding:6px 10px;border-bottom:1px solid #eee}
tr:hover td{background:#f8f9ff}
td input{width:60px;padding:3px 6px;border:1px solid #ddd;border-radius:4px;font-size:12px;text-align:center}
td input:focus{outline:none;border-color:#4361ee}
td input.wide{width:90px}
.status{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
.status.show{display:block}
.status-ok{background:#d1fae5;color:#065f46}.status-err{background:#fee2e2;color:#991b1b}
.format-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;margin-left:8px}
.format-1{background:#e0e7ff;color:#3730a3}.format-2{background:#fce7f3;color:#9d174d}
.th-copy{display:inline-block;margin-left:6px;padding:0 4px;font-size:10px;background:#dbeafe;border:none;border-radius:3px;cursor:pointer;color:#3730a3}
.th-copy:hover{background:#4361ee;color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>🎫 优惠券需求读取器 <span style="font-size:14px;color:#999;font-weight:400">v3</span></h1>
<p class="subtitle">自动识别 4 种格式，关键词智能匹配字段</p>

<div class="card">
<div class="upload-area" id="dropZone">
<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
<p>点击或拖拽上传 CSV 文件</p>
<p class="hint">支持列式 / 键值对 / 列键值（Boombastrip）/ 转置式 四种格式自动识别</p>
</div>
<input type="file" id="fileInput" accept=".csv,.txt" style="display:none">
</div>

<div id="statusBox" class="status"></div>

<div id="parsedSection" class="hidden">
<div class="card">
<div class="card-title">📊 输出表格 <span id="formatTag" class="format-tag"></span></div>
<div class="actions" style="margin-bottom:12px">
<button class="btn btn-success" onclick="exportXlsx()"> 导出 XLSX</button>
<button class="btn btn-outline" onclick="exportCsv()"> 导出 CSV</button>
</div>
<div class="table-wrap"><table id="outputTable"></table></div>
</div>
</div>
</div>

<script>
let coupons = [];

// ========== CSV Parser ==========
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = '', inQuotes = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (i+1 < text.length && text[i+1] === '"') { field += '"'; i += 2; }
        else { inQuotes = false; i++; }
      } else {
        // Inside quotes: include newlines as part of the field value
        field += c;
        i++;
      }
    } else {
      if (c === '"') { inQuotes = true; i++; }
      else if (c === ',') { row.push(field); field = ''; i++; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && i+1 < text.length && text[i+1] === '\n') i++;
        row.push(field); field = '';
        rows.push(row); row = [];
        i++;
      } else { field += c; i++; }
    }
  }
  row.push(field);
  if (row.length > 0 && row.some(function(f) { return f !== ''; })) rows.push(row);
  const maxLen = Math.max.apply(null, rows.map(function(r) { return r.length; }));
  rows.forEach(function(r) { while(r.length < maxLen) r.push(''); });
  return rows;
}

// ========== Keyword Field Matching ==========
const FIELD_RULES = [
  {key:'code', kw:['promo code name','coupon code','public code','code name'], exact:['coupon id']},
  {key:'currency', kw:['currency'], exact:['currency']},
  {key:'product', kw:['eligible product','product line','product type'], exact:['products','product']},
  {key:'type', kw:['coupon type'], exact:['type']},
  {key:'budget', kw:['budget','cost center'], exact:['budget']},
  {key:'locale', kw:['locale','language'], exact:['locale']},
  {key:'device', kw:['device','platform'], exact:['devices']},
  {key:'aidsid', kw:['aidsid','aid sid','blacklist','block list'], exact:['blacklist']},
  {key:'release', kw:['release date','start date','launch date'], exact:['release date']},
  {key:'expire', kw:['expire date','expiry date','end date'], exact:['expire date']},
  {key:'validity', kw:['validity period','validity'], exact:['validity']},
  {key:'sku', kw:['eligible sku','product description','applicable','route'], exact:[]},
  {key:'payment', kw:['eligible payment','payment method'], exact:[]},
  {key:'quota', kw:['quota','quantity','initial qty','initial quantity'], exact:['quantity']},
  {key:'mechanism', kw:['mechanism','discount rule','offer rule'], exact:['value']},
  {key:'newuser', kw:['new user','new customer'], exact:[]},
  {key:'peruid', kw:['per uid','usage limit','usage per','per account'], exact:['usage']},
  {key:'channel', kw:['channel','whitelist'], exact:['channel']},
  {key:'description', kw:['description','remark','note'], exact:['description']},
];

// 需求表从 Excel / Google Sheets 导出时，常带一些"看起来像空格"的字符：
// 不换行空格 U+00A0、窄不换行空格 U+202F、各种宽度的空格、全角空格……
// 它们和普通空格不是同一个字符，会导致字段名匹配不上，所以统一换成普通空格。
function normalizeSpaces(text) {
  return text.replace(/[   -   　]/g, ' ');
}

// 读文件：先按 UTF-8 解。若出现替换字符（U+FFFD），说明文件不是 UTF-8
// （常见于导出时用了 CP1252/Latin-1，例如 0xA0 单字节的不换行空格），改用 CP1252 重解。
function decodeBuffer(buffer) {
  const bytes = new Uint8Array(buffer);
  let text = new TextDecoder('utf-8').decode(bytes);
  if (text.indexOf('�') !== -1) {
    try {
      const alt = new TextDecoder('windows-1252').decode(bytes);
      if (alt.indexOf('�') === -1) text = alt;
    } catch (e) { /* 浏览器不支持该编码就保持原样 */ }
  }
  return text;
}

function matchField(fieldName) {
  const lower = normalizeSpaces(fieldName).toLowerCase().trim();
  if (!lower) return null;
  for (const rule of FIELD_RULES) { if (rule.exact && rule.exact.some(e => lower === e)) return rule.key; }
  for (const rule of FIELD_RULES) { if (rule.kw.some(k => lower.includes(k))) return rule.key; }
  return null;
}

// ========== Format Detection ==========
function detectFormat(rows) {
  // 注意：判定要扫全表，不能只看开头几行。
  // 需求表常在前面放一段汇总表（如三档活动预算），券表本身从二三十行才开始。
  // 这两条特征串（整格恰好等于）足够特殊，扫全表不会误判。
  for (let i = 0; i < rows.length; i++) {
    if (rows[i].filter(c => normalizeSpaces(c).trim() === 'Coupon ID').length >= 2) return 'column';
  }
  for (let i = 0; i < rows.length; i++) {
    const pcn = rows[i].filter(c => normalizeSpaces(c).trim() === 'Promo Code Name').length;
    if (pcn >= 2) return 'columnkv';
  }
  // 转置式：字段名竖排在 A 列，每只券占一「列」（券码横向铺开）。
  // 特征：某行 A 列是代码类字段名，且右侧有 ≥2 个非空值。
  // 注意要和 Format 2 区分——Format 2 的同一行只有一个值，所以要求 ≥2。
  for (let i = 0; i < rows.length; i++) {
    if (matchField(rows[i][0] || '') !== 'code') continue;
    let n = 0;
    for (let j = 1; j < rows[i].length; j++) if ((rows[i][j] || '').trim()) n++;
    if (n >= 2) return 'transposed';
  }
  // 键值对：看每行第一个非空单元格。有些表前面多一个空列（行首是逗号），
  // 若只认第 0 列就会永远取到空值，导致识别不出来。
  let kvCount = 0;
  for (let i = 0; i < rows.length; i++) {
    const f = firstNonEmptyCell(rows[i]);
    if (f && matchField(f)) kvCount++;
  }
  if (kvCount >= 3) return 'keyvalue';
  return null;
}

function firstNonEmptyCell(row) {
  for (let j = 0; j < row.length; j++) {
    const v = (row[j] || '').trim();
    if (v) return v;
  }
  return '';
}

// 取一行里的「字段名」和「值」：字段名 = 第一个非空单元格，值 = 它右边第一个非空单元格。
// 用来兼容「每行前面多一个空列」的表（行首是逗号、字段名其实在第 1 列、值在第 2 列）。
function pickLabelValue(row) {
  let li = -1;
  for (let j = 0; j < row.length; j++) {
    if ((row[j] || '').trim()) { li = j; break; }
  }
  if (li < 0) return { label: '', value: '' };
  let value = '';
  for (let j = li + 1; j < row.length; j++) {
    if ((row[j] || '').trim()) { value = row[j].trim(); break; }
  }
  return { label: row[li].trim(), value: value };
}

// ========== Number Parser ==========
function parseNum(s) {
  if (!s) return '';
  s = s.trim();
  // K suffix: 188K → 188000
  if (/[Kk]$/.test(s)) return String(Math.round(parseFloat(s.replace(/[Kk]$/, '').replace(/[.,]/g, '')) * 1000));
  // Mio suffix: 5.5Mio → 5500000
  if (/mio$/i.test(s)) {
    var numPart = s.replace(/mio$/i, '').trim().replace(/,/g, '');
    return String(Math.round(parseFloat(numPart) * 1000000));
  }
  if ((s.match(/\./g) || []).length > 1) return s.replace(/\./g, '');
  if ((s.match(/,/g) || []).length > 1) return s.replace(/,/g, '');
  return s.replace(/[.,]/g, '');
}

// ========== Value/Mechanism Parser ==========
function parseValue(str) {
  const r = {currency: '', discountDollar: '', minspendDollar: '', discountPct: '', capDollar: ''};
  if (!str) return r;
  const curM = str.match(/(S\$|RM|US\$|Rp|\$)/i);
  if (curM) {
    const sym = curM[1].toUpperCase();
    if (sym === 'S$' || sym === '$') r.currency = 'SGD';
    else if (sym === 'RM') r.currency = 'MYR';
    else if (sym === 'US$') r.currency = 'USD';
    else if (sym === 'RP') r.currency = 'IDR';
    else r.currency = sym;
  } else if (/mio/i.test(str)) {
    r.currency = 'IDR';
  }
  function clean(s) { return s ? parseNum(s.replace(/[,.]$/, '')) : ''; }
  const C = '(?:S\\$|RM|US\\$|Rp|\\$)?', N = '([\\d.,]+(?:[Kk]|io|Mio)?)';

  // Slash format: "RM50/RM600" → discount 50, min spend 600
  const slashM = str.match(new RegExp(C + '\\s*' + N + '\\s*/\\s*' + C + '\\s*' + N, 'i'));
  if (slashM) { r.discountDollar = clean(slashM[1]); r.minspendDollar = clean(slashM[2]); return r; }

  // 1) Pct with OFF: "10% OFF (max Rp200.000)" or "50% OFF (Cap RM250, min spend RM2500)" or "9% OFF, capped at S$30"
  const pctM = str.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*%\\s*OFF\\s*[,\\(]?\\s*[^)]*?(?:max|up\\s+to|capped|cap)\\s+(?:at\\s+)?(?:S\\$|RM|US\\$|Rp|\\$)?\\s*([\\d.,]+(?:[Kk]|io|Mio)?)', 'i'));
  if (pctM) {
    r.discountPct = pctM[1] + '%';
    r.capDollar = clean(pctM[2]);
    const minSpendM = str.match(new RegExp('(?:min\\.?\\s*spend|min\\s+spend|m/s)\\s*(?:S\\$|RM|US\\$|Rp|\\$)?\\s*([\\d.,]+(?:[Kk]|io|Mio)?)', 'i'));
    if (minSpendM) r.minspendDollar = clean(minSpendM[1]);
    return r;
  }
  // 2) Pct "up to": "10% up to 1.500.000 Min Spend 5.5Mio"
  const upToM = str.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*%\\s*up\\s+to\\s+' + C + '?\\s*' + N + '(?:\\s*OFF)?.*?(?:min\\.?\\s*spend|min\\s+spend|m/s)\\s*' + C + '?\\s*' + N, 'is'));
  if (upToM) { r.discountPct = upToM[1] + '%'; r.capDollar = clean(upToM[2]); r.minspendDollar = clean(upToM[3]); return r; }
  // 3) Fixed with OFF: "Rp188.000 OFF ... min spend Rp2,500,000"
  const fixM = str.match(new RegExp(C + '\\s*' + N + '\\s*OFF.*?(?:min\\.?\\s*spend|min\\s+spend|m/s)\\s*' + C + '?\\s*' + N, 'is'));
  if (fixM) { r.discountDollar = clean(fixM[1]); r.minspendDollar = clean(fixM[2]); return r; }
  // 4) Fixed without OFF: "Rp99000 min spend Rp1.200.000"
  const noOffM = str.match(new RegExp(C + '\\s*' + N + '\\s+(?:min\\.?\\s*spend|min\\s+spend|m/s)\\s*' + C + '?\\s*' + N, 'i'));
  if (noOffM) { r.discountDollar = clean(noOffM[1]); r.minspendDollar = clean(noOffM[2]); return r; }
  return r;
}

// ========== Validity Text Parser (Format 2) ==========
function parseValidity(text) {
  const r = {startDate: '', endDate: '', tagTime: '', topupQty: '', totalQty: '', _everyDay: ''};
  if (!text) return r;
  const t = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const months = {jan: '1', feb: '2', mar: '3', apr: '4', may: '5', jun: '6', jul: '7', aug: '8', sep: '9', oct: '10', nov: '11', dec: '12'};
  // Date range: "12 Aug 12PM - 18 Oct EOD" or "9 Sep 00:00 - 9 Sep 23:59"
  const rangeM = t.match(/(\d{1,2})\s+([A-Za-z]{3,})\s*(?:\d{1,2}:\d{2}\s*(?:[APap][Mm])?|EOD)?\s*[-–]\s*(\d{1,2})\s+([A-Za-z]{3,})\s*(?:\d{1,2}:\d{2}\s*(?:[APap][Mm])?|EOD)?/i);
  if (rangeM) {
    const m1 = months[rangeM[2].toLowerCase().substring(0, 3)];
    const m2 = months[rangeM[4].toLowerCase().substring(0, 3)];
    r.startDate = m1 ? m1 + '/' + rangeM[1] + '/2026' : '';
    r.endDate = m2 ? m2 + '/' + rangeM[3] + '/2026' : '';
    // Extract start time if present
    const timeM = t.match(/(\d{1,2}):\d{2}\s*[-–]/);
    if (timeM) {
      const h = parseInt(timeM[1]);
      r.tagTime = h === 0 ? '12am' : h < 12 ? h + 'am' : h === 12 ? '12pm' : (h - 12) + 'pm';
    }
  }
  // Single date: "9 Sep" or "9 Sep 12PM" or "9 Sep 00:00"
  if (!r.startDate) {
    const singleM = t.match(/(\d{1,2})\s+([A-Za-z]{3,})\s*,?\s*(\d{1,2}(?::\d{2})?\s*(?:[APap][Mm])?)?/);
    if (singleM) {
      const mon = months[singleM[2].toLowerCase().substring(0, 3)];
      if (mon) {
        r.startDate = mon + '/' + singleM[1] + '/2026';
        r.endDate = mon + '/' + singleM[1] + '/2026';
        if (singleM[3]) {
          const timeStr = singleM[3].trim();
          // Handle 24-hour format
          const h24 = timeStr.match(/^(\d{1,2}):\d{2}/);
          if (h24) {
            const h = parseInt(h24[1]);
            r.tagTime = h === 0 ? '12am' : h < 12 ? h + 'am' : h === 12 ? '12pm' : (h - 12) + 'pm';
          } else {
            r.tagTime = timeStr.replace(/\s+/g, '').toLowerCase().replace(':00', '');
          }
        }
      }
    }
  }
  // Drop time
  const dropM = t.match(/[Dd]rop\s*(?:at)?\s*(\d{1,2}[:\s]*[APap]?[Mm]?)/);
  if (dropM) r.tagTime = dropM[1].replace(/\s+/g, '').toLowerCase().replace(':00', '');
  // Topup qty
  const topupM = t.match(/(?:top\s*up|topup)\s*[:\s]*(\d+)\s*(?:qty|quantity)?/i);
  if (topupM) r.topupQty = topupM[1];
  // Total qty
  const totalM = t.match(/(?:total|total\s*qty)\s*[:\s]*(\d+)/i);
  if (totalM) r.totalQty = totalM[1];
  // Every day
  const everyM = t.match(/every\s+(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)/i);
  if (everyM) r._everyDay = everyM[1];
  return r;
}

// ========== Date Range Parser (Format 3: "5-8 August" or "9 Sep 00:00 - 9 Sep 23:59") ==========
function parseRangeDate(str) {
  if (!str) return {startDate: '', endDate: '', tagTime: ''};
  const months = {jan: '1', feb: '2', mar: '3', apr: '4', may: '5', jun: '6', jul: '7', aug: '8', sep: '9', oct: '10', nov: '11', dec: '12'};
  let m;

  // Range with 24-hour time: "9 Sep 00:00 - 9 Sep 23:59" 或 "7 Oct, 10:00 - 10 Oct 23:59"
  // 月份与时间之间允许有逗号（需求表里常写成 "7 Oct, 10:00 - …"），否则会漏到下面的
  // "5-8 August" 分支，把 "10:00" 的分钟 00 误当成开始日。
  m = str.match(/(\d{1,2})\s+([A-Za-z]{3,})\s*,?\s*(\d{1,2}):\d{2}\s*[-–]\s*(\d{1,2})\s+([A-Za-z]{3,})\s*,?\s*\d{1,2}:\d{2}/i);
  if (m) {
    const m1 = months[m[2].toLowerCase().substring(0, 3)] || '';
    const m2 = months[m[5].toLowerCase().substring(0, 3)] || '';
    if (m1 && m2) {
      const h = parseInt(m[3]);
      const tagTime = h === 0 ? '12am' : h < 12 ? h + 'am' : h === 12 ? '12pm' : (h - 12) + 'pm';
      return {startDate: m1 + '/' + m[1] + '/2026', endDate: m2 + '/' + m[4] + '/2026', tagTime: tagTime};
    }
  }

  // Range: "5-8 August"
  // 前面必须是行首/空白/逗号/括号——否则 "10:00 - 10 Oct" 里的分钟 00 会被当成开始日。
  m = str.match(/(?:^|[\s,(])(\d{1,2})\s*[-–]\s*(\d{1,2})\s+([A-Za-z]{3,})/);
  if (m) {
    const mon = months[m[3].toLowerCase().substring(0, 3)] || '';
    const d1 = parseInt(m[1]), d2 = parseInt(m[2]);
    if (mon && d1 >= 1 && d1 <= 31 && d2 >= 1 && d2 <= 31) {
      return {startDate: mon + '/' + m[1] + '/2026', endDate: mon + '/' + m[2] + '/2026', tagTime: ''};
    }
  }
  // Single date with time: "5 Aug, 6PM" or "9 Sep, top up 11AM GMT+7"
  m = str.match(/(\d{1,2})\s+([A-Za-z]{3,})/);
  if (m) {
    const mon = months[m[2].toLowerCase().substring(0, 3)] || '';
    if (mon) {
      // Extract time from the string (12-hour or 24-hour format)
      let tagTime = '';
      const timeM = str.match(/(\d{1,2})(?::\d{2})?\s*(?:[APap][Mm])/);
      if (timeM) {
        const h = parseInt(timeM[1]);
        const isPM = /[Pp][Mm]/.test(timeM[0]);
        if (isPM) {
          tagTime = h === 12 ? '12pm' : h + 'pm';
        } else {
          tagTime = h === 12 ? '12am' : h + 'am';
        }
      }
      return {startDate: mon + '/' + m[1] + '/2026', endDate: mon + '/' + m[1] + '/2026', tagTime: tagTime};
    }
  }
  // Single date only: "9 Sep" or "5 August"
  m = str.match(/(\d{1,2})\s+([A-Za-z]{3,})/);
  if (m) {
    const mon = months[m[2].toLowerCase().substring(0, 3)] || '';
    if (mon) return {startDate: mon + '/' + m[1] + '/2026', endDate: mon + '/' + m[1] + '/2026', tagTime: ''};
  }
  return {startDate: '', endDate: '', tagTime: ''};
}

// ========== Quantity Parser (Format 3) ==========
function parseQuantityText(str) {
  if (!str) return {total: 0, initialQty: 0, topupStart: '', topupTimes: 0, topupQty: 0};
  const dateEntries = [];

  // 新版写法：「Auto top-up 31 on 11 Nov 00:00」——**数量在前、日期在后**。
  // 必须放在最前面：下面的模式会被它误匹配成 day=11 / month=Nov / qty=00。
  // 第一行就是初始量（用户 2026-10-28 确认：「第一天的数据就是 initial qty」）。
  let autoM;
  const autoRegex = /Auto\s*top[-\s]*up\s*(\d+)\s*on\s*(\d{1,2})\s+([A-Za-z]{3,})/gi;
  while ((autoM = autoRegex.exec(str)) !== null) {
    dateEntries.push({day: parseInt(autoM[2]), month: autoM[3], qty: parseInt(autoM[1])});
  }

  // 优先认「日期 + 时间 + 冒号 + 数量」："23 Oct 10AM: 14" / "23 Oct 10:00: 14"
  // 必须放在最前面：下面的"无分隔符"模式会把 "10AM" 里的 10 误当成数量。
  if (dateEntries.length === 0) {
    let entryRegex = /(\d{1,2})\s+([A-Za-z]{3,})\s+\d{1,2}(?::\d{2})?\s*(?:[APap][Mm])?\s*[:=]\s*(\d+)/g;
    let m;
    while ((m = entryRegex.exec(str)) !== null) {
      dateEntries.push({day: parseInt(m[1]), month: m[2], qty: parseInt(m[3])});
    }
  }

  // 再试带分隔符的："9 Sep = 20" 或 "9 Sep: 20"
  if (dateEntries.length === 0) {
    entryRegex = /(\d{1,2})\s+([A-Za-z]{3,})\s*[=:]\s*(\d+)/gi;
    while ((m = entryRegex.exec(str)) !== null) {
      dateEntries.push({day: parseInt(m[1]), month: m[2], qty: parseInt(m[3])});
    }
  }

  // If no matches, try format without separator: "9 Sep 20" or "9 Sep  20"
  if (dateEntries.length === 0) {
    entryRegex = /(\d{1,2})\s+([A-Za-z]{3,})\s+(\d+)/gi;
    while ((m = entryRegex.exec(str)) !== null) {
      dateEntries.push({day: parseInt(m[1]), month: m[2], qty: parseInt(m[3])});
    }
  }

  if (dateEntries.length > 0) {
    const months = {jan: '1', feb: '2', mar: '3', apr: '4', may: '5', jun: '6', jul: '7', aug: '8', sep: '9', oct: '10', nov: '11', dec: '12'};
    const initialQty = dateEntries[0].qty;
    const total = dateEntries.reduce(function(s, d) { return s + d.qty; }, 0);
    const topupTimes = Math.max(0, dateEntries.length - 1);
    let topupStart = '', topupQty = 0;
    if (dateEntries.length > 1) {
      const td = dateEntries[1];
      const mon = months[td.month.toLowerCase().substring(0, 3)] || '';
      if (mon) topupStart = mon + '/' + td.day + '/2026';
      topupQty = td.qty;
    }
    // End date = last date in breakdown
    const lastD = dateEntries[dateEntries.length - 1];
    const lastMon = months[lastD.month.toLowerCase().substring(0,3)] || '';
    const endDate = lastMon ? lastMon + '/' + lastD.day + '/2026' : '';
    // 间隔：前两个日期的天数差（不能写死 7 天——很多表是每天加一次，
    // 写死会导致 End 被算到很后面，例如 11/12 加 3 次被算成 12/3）
    let interval = 0;
    if (dateEntries.length > 1) {
      const m1 = months[dateEntries[0].month.toLowerCase().substring(0,3)];
      const m2 = months[dateEntries[1].month.toLowerCase().substring(0,3)];
      if (m1 && m2) {
        const d1 = new Date(2026, +m1 - 1, dateEntries[0].day);
        const d2 = new Date(2026, +m2 - 1, dateEntries[1].day);
        interval = Math.round((d2 - d1) / 86400000);
      }
    }
    // explicit: 明细里逐条列了日期，次数已经确定，后面不要再按间隔重算
    return {total: total, initialQty: initialQty, topupStart: topupStart, topupTimes: topupTimes, topupQty: topupQty, endDate: endDate, interval: interval, explicit: true};
  }
  const n = parseInt(str);
  const val = isNaN(n) ? 0 : n;
  return {total: val, initialQty: val, topupStart: '', topupTimes: 0, topupQty: 0, endDate: ''};
}

// ========== Date Math ==========
function parseDateMDY(str) {
  const m = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (!m) return null;
  return new Date(+m[3], +m[1] - 1, +m[2]);
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function fmtDate(d) { return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear(); }
function calcEndDate(ts, interval, times) {
  const s = parseDateMDY(ts);
  if (!s) return '';
  return fmtDate(addDays(s, interval * times));
}

// ========== Auto-calculate topupTimes from dates ==========
function autoCalcTopupTimes() {
  coupons.forEach(function(c) {
    if (c._autoInterval) {
      const dayMap = {sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6};
      if (dayMap[c._autoInterval.toLowerCase()] !== undefined) c.topupInterval = 7;
    }
    // topup 次数分三种情况，只有第 2 种才按间隔推算：
    //
    // ① 数量明细逐条列了日期（"23 Oct 10AM: 14 / 24 Oct: 9 / 25 Oct: 6"）
    //    → 次数 = 日期数 - 1，parseQuantityText 已算好，不能覆盖。
    //    曾经出过 bug：CITIFLYMORE 明细是 26/27/28 Oct，但 Validity 到 11/3，
    //    按间隔重算得出 8 次，实际只加 2 次。
    //
    // ② Validity 里明确给了节奏（"Drop at 12PM every Wednesday"）
    //    → 没有具体日期，只能按 (到期日 - 开始日) ÷ 间隔 推算。
    //
    // ③ 数量就是个纯数字、没写哪天加多少（如 "20"）
    //    → 按一次性投放处理，次数 = 0。不要拿 Validity 的跨度去推。
    //    用户口径（2026-10-09）：「没有明确哪一天 qty 是多少就当作一次性」。
    if (c._qtyExplicit) return;
    if (!c._autoInterval) { c.topupTimes = 0; return; }
    const s = parseDateMDY(c.startDate || c.topupDateStart);
    const e = parseDateMDY(c._expireDate);
    if (s && e && c.topupInterval > 0) {
      const diff = Math.round((e - s) / (1000 * 60 * 60 * 24));
      c.topupTimes = Math.floor(diff / c.topupInterval);
    }
  });
}

// ========== Product Code Mapping ==========
const PRODUCT_CODES = {
  'flight': 'F',
  'flights': 'F',
  'hotel': 'H',
  'hotels': 'H',
  'china train': 'T',
  'train': 'T',
  'international train': 'E',
  'attractions': 'P',
  'tours': 'P',
  'attractions & tours': 'P',
  'cruise': 'CRU',
  'cruises': 'CRU',
  'packaged tours': 'TOR',
  'tour': 'TOR',
  'car rental': 'C',
  'car': 'C',
  'airport transfer': 'A',
  'transfer': 'A',
  'bundle': 'X',
  'bundlesave': 'X',
  'bundle&save': 'X',
  // 需求表里偶尔用 "B&S / Biz & First" 指商务舱+头等舱（属于机票）
  'b&s': 'F',
  'biz & first': 'F',
  'business & first': 'F'
};

function getProductCode(str) {
  if (!str) return '';
  const lower = str.toLowerCase().trim();
  // Exact match first
  if (PRODUCT_CODES[lower]) return PRODUCT_CODES[lower];
  // Contains match
  for (const key in PRODUCT_CODES) {
    if (lower.includes(key)) return PRODUCT_CODES[key];
  }
  return '';
}

// ========== Format 1: Column-based Extractor (multi-section) ==========
function extractColumnFormat(rows) {
  var allCoupons = [];
  var months = {jan: '1', feb: '2', mar: '3', apr: '4', may: '5', jun: '6', jul: '7', aug: '8', sep: '9', oct: '10', nov: '11', dec: '12'};

  // Scan ALL rows for "Coupon ID" headers
  for (var hri = 0; hri < rows.length; hri++) {
    var pcnCount = 0;
    for (var j = 0; j < rows[hri].length; j++) {
      if (normalizeSpaces(rows[hri][j]).trim() === 'Coupon ID') pcnCount++;
    }
    if (pcnCount < 1) continue;

    var hr = rows[hri];
    // Get section date from first cell (e.g., "4 Sep\n12 AM")
    var sectionDate = hr[0].trim();
    var dateM = sectionDate.match(/(\d{1,2})\s+([a-zA-Z]{3})/);
    var timeM = sectionDate.match(/(\d{1,2})\s*([APap][Mm])/);
    var startDate = '';
    if (dateM) {
      var mon = months[dateM[2].toLowerCase().substring(0, 3)] || '';
      if (mon) startDate = mon + '/' + dateM[1] + '/2026';
    }

    // Find coupon column groups
    // 注意要从第 0 列开始扫：有些表「Coupon ID」直接放在 A 列（左边那个券块），
    // 从 1 开始会把整块漏掉（2026-10-28 用户报「5 个券只读出 3 个」就是这个原因）。
    var groups = [];
    for (var i = 0; i < hr.length; i++) {
      if (normalizeSpaces(hr[i]).trim() === 'Coupon ID' && i + 1 < hr.length) groups.push({fc: i, vc: i + 1});
    }
    if (!groups.length) continue;

    // Extract each coupon in this section
    for (var gi = 0; gi < groups.length; gi++) {
      var g = groups[gi];
      var fields = {};
      var qtyRaw = '';
      // Read code from header row (value column)
      fields.code = (hr[g.vc] || '').trim();

      for (var r = hri + 1; r < rows.length; r++) {
        // Stop at next section header
        var nextPcn = 0;
        for (var nj = 0; nj < rows[r].length; nj++) { if (normalizeSpaces(rows[r][nj]).trim() === 'Coupon ID') nextPcn++; }
        if (nextPcn > 0 && r !== hri) break;

        var fn = (rows[r][g.fc] || '').trim();
        var key = matchField(fn);

        if (key === 'quota' || key === 'quantity') {
          // Start collecting quantity data
          qtyRaw = (rows[r][g.vc] || '').trim();
          // Continue reading subsequent rows that don't have a field name
          for (var r2 = r + 1; r2 < rows.length; r2++) {
            var nextField = (rows[r2][g.fc] || '').trim();
            if (nextField && matchField(nextField)) break; // Hit next field
            var nextVal = (rows[r2][g.vc] || '').trim();
            if (nextVal) qtyRaw += ' ' + nextVal;
          }
          fields.quota = qtyRaw;
        } else if (key) {
          fields[key] = (rows[r][g.vc] || '').trim();
        }
      }

      if (!fields.code) continue;

      // Build release date from section date + time
      if (timeM && !fields.release) {
        var th = parseInt(timeM[1]);
        var ampm = timeM[2].toUpperCase();
        if (ampm === 'PM' && th !== 12) th += 12;
        if (ampm === 'AM' && th === 12) th = 0;
        fields.release = (fields.release || '') || (startDate ? startDate.replace(/\/\d{4}$/, '/2026') + ' ' + th + ':00' : '');
      }

      allCoupons.push(buildCouponFromFields(fields, startDate));
    }
  }
  return allCoupons.filter(function(c) { return c && c.code; });
}

// ========== 转置式：字段名竖排在 A 列，每只券占一「列」 ==========
// 例（Promo Code Brief）：
//   Bank,            CITIBANK,      CITIBANK,      CITIBANK
//   Promo Code Name, CITISQTTF500F, CITISQTTF120F, CITISQTTF65F
//   Products,        All flight…,   All flight…,   All flight…
//   Validity,        23 Oct 10:00- 23 Oct 10:00- 23 Oct 10:00-
// 一行是一只券的一个字段；券与券之间靠「列」区分。
function extractTransposedFormat(rows) {
  var allCoupons = [];

  // 先找出所有「券码行」：A 列是代码类字段名，且右侧有 ≥2 个非空值
  var codeRows = [];
  for (var i = 0; i < rows.length; i++) {
    if (matchField(rows[i][0] || '') !== 'code') continue;
    var n = 0;
    for (var j = 1; j < rows[i].length; j++) if ((rows[i][j] || '').trim()) n++;
    if (n >= 2) codeRows.push(i);
  }
  if (!codeRows.length) return allCoupons;

  for (var ci = 0; ci < codeRows.length; ci++) {
    var hri = codeRows[ci];
    var stop = (ci + 1 < codeRows.length) ? codeRows[ci + 1] : rows.length;

    // 这一段的券分别在哪几列
    var cols = [];
    for (var j = 1; j < rows[hri].length; j++) if ((rows[hri][j] || '').trim()) cols.push(j);

    // 段标题（向上找最近的非空 A 列且不是字段名的行），用来兜底产线
    var sectionTitle = '';
    for (var u = hri - 1; u >= 0 && u >= hri - 4; u--) {
      var t = (rows[u][0] || '').trim();
      if (t && !matchField(t)) { sectionTitle = t; break; }
    }
    var sectionProduct = getProductCode(sectionTitle);

    for (var gi = 0; gi < cols.length; gi++) {
      var vc = cols[gi];
      var fields = {};
      fields.code = (rows[hri][vc] || '').trim();

      for (var r = hri + 1; r < stop; r++) {
        var fn = (rows[r][0] || '').trim();
        if (!fn) continue;
        var key = matchField(fn);
        if (!key) continue;
        var val = (rows[r][vc] || '').trim();
        if (key === 'quota') fields.quota = val;
        else if (!fields[key]) fields[key] = val;
      }

      if (!fields.code) continue;
      var c = buildCouponFromFields(fields, '');
      if (!c.product) c.product = sectionProduct;
      allCoupons.push(c);
    }
  }
  return allCoupons.filter(function(c) { return c && c.code; });
}

function buildCouponFromFields(fields, startDate) {
  const val = parseValue(fields.mechanism || '');
  const rp = fields.release ? parseDateTimeStr(fields.release) : {date: '', time: ''};
  const v = fields.validity ? parseValidity(fields.validity) : {};
  const product = getProductCode(fields.product || '');
  const ccM = (fields.budget || '').match(/\((\d+)\)|(\d{3,})/);

  return {
    code: fields.code || '',
    currency: fields.currency || val.currency || '',
    product: product,
    startDate: startDate || v.startDate || rp.date || '',
    costCenter: ccM ? (ccM[1] || ccM[2]) : '',
    tag: v.tagTime || rp.time || '',
    sku: fields.sku || '',
    usagePerAccount: fields.peruid || '',
    paymentLimit: fields.payment || '',
    deviceLimit: fields.device || '',
    newUserOnly: fields.newuser || '',
    travelDateLimit: '',
    discountDollar: val.discountDollar,
    minspendDollar: val.minspendDollar,
    discountPct: val.discountPct,
    capDollar: val.capDollar,
    initialQty: (function() {
      const q = parseQuantityText(fields.quota || '');
      return q.initialQty || parseInt(fields.quota) || 0;
    })(),
    topupDateStart: (function() {
      const q = parseQuantityText(fields.quota || '');
      return q.topupStart || v.startDate || '';
    })(),
    topupInterval: 1,
    topupQty: (function() {
      const q = parseQuantityText(fields.quota || '');
      return q.topupQty || parseInt(v.topupQty) || 0;
    })(),
    topupTimes: (function() {
      const q = parseQuantityText(fields.quota || '');
      return q.topupTimes || 0;
    })(),
    _releaseDate: fields.release ? (parseDateTimeStr(fields.release).date || fields.release) : '',
    _expireDate: fields.expire ? (parseDateTimeStr(fields.expire).date || fields.expire) : (v.endDate || ''),
    _mechanism: fields.mechanism || '',
    _locale: fields.locale || '',
    _aidsid: fields.aidsid || '',
    _validity: fields.validity || '',
    _totalQty: (function() {
      const q = parseQuantityText(fields.quota || '');
      return q.total || parseInt(v.totalQty) || 0;
    })(),
    _channel: fields.channel || '',
    _description: fields.description || '',
    _autoInterval: v._everyDay || null,
    _qtyExplicit: parseQuantityText(fields.quota || '').explicit || false,
  };
}

function parseDateTimeStr(str) {
  if (!str) return {date: '', time: ''};
  // Format 1: "M/D/YYYY H:MM AM/PM" or "M/D/YYYY, H:MM PM"
  var m = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4}),?\s*(\d{1,2}:\d{2}\s*[APap][Mm])?/);
  if (m) {
    var year = m[3].length === 2 ? '20' + m[3] : m[3];
    return {date: parseInt(m[1]) + '/' + parseInt(m[2]) + '/' + year, time: m[4] ? m[4].replace(/\s+/g, '').toLowerCase().replace(':00', '') : ''};
  }
  // Format 2: "YYYY/M/D H:MM" (e.g., "2026/9/4 0:00")
  m = str.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s*(\d{1,2}):(\d{2})?/);
  if (m) {
    var h = parseInt(m[4]);
    var timeStr = h + ':' + (m[5] || '00');
    return {date: parseInt(m[2]) + '/' + parseInt(m[3]) + '/' + m[1], time: timeStr.replace(':00', '')};
  }
  // Format 3: "M/D/YY H:MM AM/PM" (e.g., "9/9/26 12:00 AM")
  m = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{2})\s+(\d{1,2}:\d{2}\s*[APap][Mm])/);
  if (m) {
    return {date: parseInt(m[1]) + '/' + parseInt(m[2]) + '/20' + m[3], time: m[4].replace(/\s+/g, '').toLowerCase().replace(':00', '')};
  }
  return {date: str, time: ''};
}

// ========== Format 2: Key-Value Extractor ==========
function extractKeyValueFormat(rows) {
  const couponBlocks = [];
  let currentBlock = {};
  let productHint = '', desc = '';

  for (let i = 0; i < rows.length; i++) {
    // 有些需求表每行前面多一个空列（例如导出后每行都以逗号开头），字段名在第 1 列、值在第 2 列。
    // 所以按「第一个非空格 = 字段名，它右边第一个非空格 = 值」来取，不能写死 [0] / [1]。
    const lv = pickLabelValue(rows[i]);
    const c0 = lv.label, c1 = lv.value;
    if (!c0 && !c1) {
      if (Object.keys(currentBlock).length >= 3) { currentBlock._hint = productHint; currentBlock._desc = desc; couponBlocks.push(currentBlock); }
      currentBlock = {};
      continue;
    }
    if (!c1 && /^(flights?|hotels?)/i.test(c0)) { productHint = c0; continue; }
    if (!c1 && !matchField(c0)) { desc = c0; continue; }
    if (/coupon\s*drop/i.test(c0) && !c1) continue;
    const key = matchField(c0);
    if (key && c1) {
      if (key === 'product') {
        currentBlock.product = getProductCode(c1);
        currentBlock.sku = c1;
      } else { currentBlock[key] = c1; }
    }
  }
  if (Object.keys(currentBlock).length >= 3) { currentBlock._hint = productHint; currentBlock._desc = desc; couponBlocks.push(currentBlock); }

  return couponBlocks.map(function(b) {
    const val = parseValue(b.mechanism || '');
    const v = b.validity ? parseValidity(b.validity) : {};
    let product = b.product || '';
    if (!product && b._hint) {
      product = getProductCode(b._hint);
    }
    const ccM = (b.budget || '').match(/(\d{3,})/);
    // 数量可能是多行明细（"Total: 76 / 11 Nov 12AM: 46 qty / 12 Nov 12AM: 10 qty …"），
    // 不能直接 parseInt(b.quota)，否则读到 "Total:" 就变成 0。统一走 parseQuantityText。
    const q = parseQuantityText(b.quota || '');
    const topupQty = q.topupQty || parseInt(v.topupQty) || 0;
    const totalQty = q.total || parseInt(v.totalQty) || 0;
    const initialQty = q.initialQty || parseInt(b.quota) || totalQty;

    return {
      code: b.code || '',
      currency: val.currency || '',
      product: product,
      startDate: v.startDate || '',
      costCenter: ccM ? ccM[1] : '',
      tag: v.tagTime || '',
      sku: b.sku || '',
      usagePerAccount: b.peruid || '',
      paymentLimit: '',
      deviceLimit: b.device || '',
      newUserOnly: '',
      travelDateLimit: '',
      discountDollar: val.discountDollar,
      minspendDollar: val.minspendDollar,
      discountPct: val.discountPct,
      capDollar: val.capDollar,
      initialQty: initialQty,
      topupDateStart: q.topupStart || v.startDate || '',
      // 有明细日期就用实际间隔（逐日加量 = 1），没有才退回默认 7 天
      topupInterval: (q.interval && q.interval > 0) ? q.interval : 7,
      topupQty: topupQty,
      topupTimes: q.topupTimes || 0,
      _releaseDate: v.startDate || '',
      _expireDate: v.endDate || '',
      _mechanism: b.mechanism || '',
      _locale: '',
      _aidsid: b.aidsid || '',
      _validity: b.validity || '',
      _totalQty: totalQty,
      _channel: b.channel || '',
      _description: b.description || '',
      _autoInterval: v._everyDay || null,
      _qtyExplicit: parseQuantityText(b.quota || '').explicit || false,
    };
  }).filter(function(c) { return c && c.code; });
}

// ========== Format 3: Column Key-Value Extractor ==========
function extractColumnKVFormat(rows) {
  const allCoupons = [];

  // Pre-scan: find ALL section header rows
  const headerRows = new Set();
  for (let ri = 0; ri < rows.length; ri++) {
    let pcnCount = 0;
    for (let j = 0; j < rows[ri].length; j++) {
      if (normalizeSpaces(rows[ri][j]).trim() === 'Promo Code Name') pcnCount++;
    }
    if (pcnCount >= 1) headerRows.add(ri);
  }

  for (let ri = 0; ri < rows.length; ri++) {
    const pcnCols = [];
    for (let j = 0; j < rows[ri].length; j++) {
      if (normalizeSpaces(rows[ri][j]).trim() === 'Promo Code Name') pcnCols.push(j);
    }
    if (pcnCols.length < 1) continue;

    const step = pcnCols.length > 1 ? pcnCols[1] - pcnCols[0] : 2;
    const groups = pcnCols.map(function(fc) { return {fc: fc, vc: fc + 1}; });

    // Date context
    const dateContexts = groups.map(function(g) {
      for (let dr = ri - 1; dr >= Math.max(0, ri - 4); dr--) {
        const dv = (rows[dr][g.fc] || '').trim();
        if (dv && /\d/.test(dv) && !matchField(dv)) return dv;
      }
      return '';
    });

    // Section product type
    let sectionProduct = '';
    for (let dr = ri - 1; dr >= Math.max(0, ri - 5); dr--) {
      const title = (rows[dr][0] || '').trim();
      if (title) {
        const code = getProductCode(title);
        if (code) { sectionProduct = code; break; }
      }
    }

    for (let gi = 0; gi < groups.length; gi++) {
      const g = groups[gi];
      const fields = {};
      let qtyRaw = '';

      // Code from header
      fields.code = (rows[ri][g.vc] || '').trim();

      // Budget is in the row above the header - search upward
      var budgetRow = ri - 1;
      while (budgetRow >= 0) {
        var bf = (rows[budgetRow][g.fc] || '').trim();
        if (bf === 'Budget') {
          fields.budget = (rows[budgetRow][g.vc] || '').trim();
          break;
        }
        if (bf && matchField(bf)) break;
        budgetRow--;
      }

      for (let r = ri + 1; r < rows.length; r++) {
        if (headerRows.has(r) && r !== ri) break;
        const fieldName = (rows[r][g.fc] || '').trim();
        const value = (rows[r][g.vc] || '').trim();

        // Handle multi-line values ONLY for fields that truly span multiple rows
        const multiLineFields = ['mechanism', 'description'];
        const fk0 = matchField(fieldName);
        // Skip budget - already handled by upward search
        if (fk0 === 'budget') continue;

        const isMultiLine = fk0 && ['mechanism', 'description'].indexOf(fk0) >= 0;
        if (isMultiLine && value) {
          // Check if next row has continuation (no field name, has value in same col)
          let fullValue = value;
          let r2 = r + 1;
          while (r2 < rows.length) {
            if (headerRows.has(r2)) break;
            const nextField = (rows[r2][g.fc] || '').trim();
            if (nextField && matchField(nextField)) break; // Hit next field
            const nextVal = (rows[r2][g.vc] || '').trim();
            if (nextVal && !fieldName) {
              fullValue += ' ' + nextVal;
              r2++;
            } else if (!nextField && nextVal) {
              fullValue += ' ' + nextVal;
              r2++;
            } else {
              break;
            }
          }
          fields[matchField(fieldName)] = fullValue;
          continue;
        }

        if (!fieldName) {
          if (value && qtyRaw) qtyRaw += ' ' + value;
          continue;
        }

        const fieldKey = matchField(fieldName);

        // Check if fieldName is a date (e.g., "9 Sep", "10 Sep") - treat as quantity data
        const isDateField = fieldName.match(/^\d{1,2}\s+[A-Za-z]{3}/);
        if (isDateField) {
          // 只有本组还没收到数量时，才把日期行当作数量明细。
          // 否则这一行多半属于下一段的日期表头（例如 "7 Oct, 11AM"），
          // 覆盖上去会把已经解析好的数量冲掉。
          if (qtyRaw) continue;
          // Start collecting quantity data from date rows
          qtyRaw = fieldName + ' ' + value;
          for (let r2 = r + 1; r2 < rows.length; r2++) {
            if (headerRows.has(r2)) break;
            const nextField = (rows[r2][g.fc] || '').trim();
            if (nextField && matchField(nextField)) break;
            const nextVal = (rows[r2][g.vc] || '').trim();
            if (nextVal) qtyRaw += ' ' + nextField + ' ' + nextVal;
            else if (!nextField) continue;
            else break;
          }
          fields.quantity = qtyRaw;
          continue;
        }

        if (!fieldKey) continue;

        if (fieldKey === 'quantity' || fieldKey === 'quota') {
          qtyRaw = value;
          for (let r2 = r + 1; r2 < rows.length; r2++) {
            if (headerRows.has(r2)) break;
            const nextField = (rows[r2][g.fc] || '').trim();
            if (nextField && matchField(nextField)) break;
            const nextVal = (rows[r2][g.vc] || '').trim();
            if (nextVal) qtyRaw += ' ' + nextVal;
            else if (!nextField) continue;
            else break;
          }
          fields.quantity = qtyRaw;
        } else {
          fields[fieldKey] = value;
        }

        if (fieldKey === 'product') {
          fields.sku = value;
          fields._productType = getProductCode(value) || sectionProduct;
        }
      }

      if (!fields.code) continue;
      if (!fields._productType) fields._productType = sectionProduct;

      const dateCtx = dateContexts[gi] || '';
      const vDate = parseRangeDate(fields.validity || dateCtx);
      const qtyInfo = parseQuantityText(fields.quantity || fields.quota || '');
      const val = parseValue(fields.mechanism || '');
      const ccM = (fields.budget || '').match(/(\d{3,})/);

      allCoupons.push({
        code: fields.code,
        currency: val.currency || '',
        product: fields._productType || '',
        startDate: vDate.startDate || '',
        costCenter: ccM ? ccM[1] : '',
        tag: vDate.tagTime || '',
        sku: fields.sku || '',
        usagePerAccount: fields.peruid || '',
        paymentLimit: '',
        deviceLimit: fields.device || '',
        newUserOnly: '',
        travelDateLimit: '',
        discountDollar: val.discountDollar,
        minspendDollar: val.minspendDollar,
        discountPct: val.discountPct,
        capDollar: val.capDollar,
        initialQty: qtyInfo.initialQty,
        topupDateStart: qtyInfo.topupStart || vDate.startDate || '',
        topupInterval: 1,
        topupQty: qtyInfo.topupQty || 0,
        topupTimes: qtyInfo.topupTimes || 0,
        _releaseDate: vDate.startDate || '',
        _expireDate: qtyInfo.endDate || vDate.endDate || '',
        _mechanism: fields.mechanism || '',
        _locale: '',
        _aidsid: fields.aidsid || '',
        _validity: fields.validity || dateCtx,
        _totalQty: qtyInfo.total,
        _channel: fields.channel || '',
        _description: fields.description || '',
        _autoInterval: null,
        _qtyExplicit: qtyInfo.explicit || false,
      });
    }
  }
  return allCoupons;
}

// ========== UI ==========
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const statusBox = document.getElementById('statusBox');
dropZone.addEventListener('click', function() { fileInput.click(); });
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', function(e) { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', function(e) { if (e.target.files.length) handleFile(e.target.files[0]); });

function showStatus(msg, type) { statusBox.className = 'status show status-' + type; statusBox.textContent = msg; }

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = normalizeSpaces(decodeBuffer(e.target.result));
      const rows = parseCSV(text);
      const format = detectFormat(rows);
      if (!format) {
        // 报错时把「读到了什么」一并显示，便于判断是格式不支持还是文件本身有问题
        const nCol = (rows[0] || []).length;
        const preview = rows.slice(0, 3)
          .map(function(r) { return r.filter(function(c) { return c.trim(); }).slice(0, 6).join(' | '); })
          .filter(Boolean).join('  ／  ');
        throw new Error('无法识别 CSV 格式。读到 ' + rows.length + ' 行 × ' + nCol +
          ' 列；开头内容是：' + preview.slice(0, 200));
      }

      if (format === 'column') coupons = extractColumnFormat(rows);
      else if (format === 'columnkv') coupons = extractColumnKVFormat(rows);
      else if (format === 'transposed') coupons = extractTransposedFormat(rows);
      else coupons = extractKeyValueFormat(rows);

      if (!coupons.length) throw new Error('未解析到任何优惠券');

      autoCalcTopupTimes();

      const fmtLabel = format === 'column' ? '列式 (Format 1)'
        : format === 'columnkv' ? '列键值 (Format 3)'
        : format === 'transposed' ? '转置式 (Format 4)'
        : '键值对 (Format 2)';
      const fmtClass = format === 'keyvalue' ? 'format-2' : 'format-1';
      document.getElementById('formatTag').className = 'format-tag ' + fmtClass;
      document.getElementById('formatTag').textContent = fmtLabel;

      showStatus('✅ 解析 ' + coupons.length + ' 个优惠券: ' + coupons.map(function(c) { return c.code; }).join(', '), 'ok');
      renderAll();
      document.getElementById('parsedSection').classList.remove('hidden');
    } catch (err) {
      showStatus('❌ ' + err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderAll() { renderOutputTable(); }

const OUT_COLS = [
  {key: 'code', label: 'Code', edit: false},
  {key: 'currency', label: 'Curr.', edit: false},
  {key: 'product', label: 'Product', edit: false},
  {key: 'startDate', label: 'Start', edit: false},
  {key: '_endDate', label: 'End', edit: false},
  {key: 'costCenter', label: 'Cost Center', edit: false},
  {key: 'tag', label: 'Tag', edit: true, type: 'text'},
  {key: 'discountDollar', label: 'Discount$', edit: true, type: 'text'},
  {key: 'minspendDollar', label: 'Minspend$', edit: true, type: 'text'},
  {key: 'discountPct', label: 'Discount%', edit: true, type: 'text'},
  {key: 'capDollar', label: 'Cap$', edit: true, type: 'text'},
  {key: 'initialQty', label: 'Init qty', edit: true, type: 'number'},
  {key: 'sku', label: 'sku', edit: true, type: 'text', wide: true},
  {key: 'usagePerAccount', label: 'Usage/acct', edit: true, type: 'text', wide: true},
  {key: 'paymentLimit', label: 'pay limit', edit: true, type: 'text'},
  {key: 'deviceLimit', label: 'Device', edit: true, type: 'text'},
  {key: 'newUserOnly', label: 'New user', edit: true, type: 'text'},
  {key: 'travelDateLimit', label: 'Travel date', edit: true, type: 'text'},
  {key: 'topupDateStart', label: 'Topup start', edit: true, type: 'text', wide: true},
  {key: 'topupInterval', label: 'Interval', edit: true, type: 'number'},
  {key: 'topupQty', label: 'Topup qty', edit: true, type: 'number'},
  {key: 'topupTimes', label: 'Times', edit: true, type: 'number'},
];

function renderOutputTable() {
  coupons.forEach(function(c) {
    if (c._expireDate && (c.topupInterval <= 1 || !c.topupTimes)) {
      c._endDate = c._expireDate;
    } else {
      c._endDate = calcEndDate(c.topupDateStart, parseInt(c.topupInterval) || 0, parseInt(c.topupTimes) || 0);
    }
  });
  var html = '<thead><tr>' + OUT_COLS.map(function(c, i) {
    return '<th>' + c.label + '<button class="th-copy" onclick="copyColumn(' + i + ')" title="复制整列">⧈</button></th>';
  }).join('') + '</tr></thead><tbody>';
  coupons.forEach(function(c, ci) {
    html += '<tr>';
    OUT_COLS.forEach(function(col) {
      var val = c[col.key] !== undefined ? c[col.key] : '';
      if (col.edit) {
        html += '<td><input type="' + col.type + '" value="' + esc(String(val)) + '" data-ci="' + ci + '" data-key="' + col.key + '" onchange="onCellChange(this)"' + (col.wide ? ' class="wide"' : '') + '></td>';
      } else {
        html += '<td>' + esc(String(val)) + '</td>';
      }
    });
    html += '</tr>';
  });
  document.getElementById('outputTable').innerHTML = html;
}

function onCellChange(el) {
  var ci = +el.dataset.ci, key = el.dataset.key;
  coupons[ci][key] = el.value;
  coupons[ci]._endDate = (coupons[ci]._expireDate && (coupons[ci].topupInterval <= 1 || !coupons[ci].topupTimes)) ? coupons[ci]._expireDate : calcEndDate(coupons[ci].topupDateStart, parseInt(coupons[ci].topupInterval) || 0, parseInt(coupons[ci].topupTimes) || 0);
  renderOutputTable();
}

function copyColumn(colIdx) {
  var key = OUT_COLS[colIdx].key;
  var vals = coupons.map(function(c) {
    if (key === '_endDate') return (c._expireDate && (c.topupInterval <= 1 || !c.topupTimes)) ? c._expireDate : calcEndDate(c.topupDateStart, parseInt(c.topupInterval) || 0, parseInt(c.topupTimes) || 0);
    return c[key] !== undefined ? String(c[key]) : '';
  });
  navigator.clipboard.writeText(vals.join('\n')).then(function() {
    var btns = document.querySelectorAll('.th-copy');
    btns[colIdx].textContent = '✓'; btns[colIdx].style.background = '#10b981'; btns[colIdx].style.color = '#fff';
    setTimeout(function() { btns[colIdx].textContent = '⧈'; btns[colIdx].style.background = ''; btns[colIdx].style.color = ''; }, 1000);
  });
}

// ========== Export ==========
function buildExportData() {
  var h = ['Code', 'Curr.', 'Product', 'Start', 'End', 'Cost Center', 'Tag',
    'Discount$', 'Minspend$', 'Discount%', 'Cap$', 'Initial qty', 'sku',
    'Usage per account', 'payment limit', 'Device limit', 'New user only', 'Traveldate limit',
    'date start to top up', 'top up interval', 'top up qty per time', 'top up times'];
  var r = coupons.map(function(c) {
    var end = (c._expireDate && (c.topupInterval <= 1 || !c.topupTimes)) ? c._expireDate : calcEndDate(c.topupDateStart, parseInt(c.topupInterval) || 0, parseInt(c.topupTimes) || 0);
    return [c.code, c.currency, c.product, c.startDate, end, c.costCenter, c.tag,
      c.discountDollar, c.minspendDollar, c.discountPct, c.capDollar, c.initialQty,
      c.sku, c.usagePerAccount, c.paymentLimit, c.deviceLimit, c.newUserOnly,
      c.travelDateLimit, c.topupDateStart, c.topupInterval, c.topupQty, c.topupTimes];
  });
  return {headers: h, rows: r};
}

function exportXlsx() {
  var data = buildExportData();
  var ws = XLSX.utils.aoa_to_sheet([data.headers].concat(data.rows));
  ws['!cols'] = data.headers.map(function(h, i) { return {wch: Math.min(Math.max(h.length, ...data.rows.map(function(r) { return String(r[i] || '').length; })) + 2, 30)}; });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet2');
  XLSX.writeFile(wb, 'coupon_output.xlsx');
}

function exportCsv() {
  var data = buildExportData();
  var all = [data.headers].concat(data.rows);
  var csv = all.map(function(r) { return r.map(function(v) { return '"' + String(v || '').replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var blob = new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'coupon_output.csv'; a.click();
}

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
</script>
